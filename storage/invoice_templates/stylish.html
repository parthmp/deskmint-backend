<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: {{$render_font_size}};
            color: {{$render_secondary_color}};
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .ribbon {
            background: {{$render_primary_color}};
        }

        .title {
            font-size: {{$render_font_size_inc}};
            font-weight: bold;
        }

        .items th {
            background: #e5e7eb;
            padding: 8px;
            border-bottom: 2px solid {{$render_primary_color}};
        }

        .items td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .right {
            text-align: right;
        }
		.invoice_number, .company_name, .client_company_name, .name, .total_fields{
			font-size: {{$render_font_size_inc}};
			font-weight: bold;
		}
		td {
			vertical-align: top;
		}

    </style>
</head>
<body>
<table cellpadding="10">
	<tr>
		<td align="right">{{$render_logo}}</td>
	</tr>
</table>
<table cellpadding="10">
    <tr>
        <td>
			{{$render_client_details}}
        </td>
		<td align="left">
			{{$render_company_details}}
        </td>
        <td align="right">
			{{$render_invoice_details}}
        </td>
    </tr>
</table>

<p class="ribbon">
	<br>
</p>

<table class="items" cellpadding="10">
	{{$render_product_rows}}
</table>
<br>
<span class="total_fields">
	<table cellpadding="10">
		<tr>
			<td></td>
			<td align="right">{{$render_total_fields}}</td>
		</tr>
	</table>
	
</span>
<br>
<br>
<table cellpadding="10">
	<tr>
		<td><p>{{$render_terms}}</p></td>
	</tr>
</table>
<br>
<table cellpadding="10">
	<tr>
		<td><p>{{$render_footer}}</p></td>
	</tr>
</table>
<br>
<p>Status : {{$invoice_status}}</p>
<br>
</body>
</html>
