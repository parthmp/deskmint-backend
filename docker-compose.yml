services:
  app:
    build:
      context: .
      dockerfile: docker.dev/php/Dockerfile
    image: deskmint-app:1.0
    container_name: deskmint_app
    working_dir: /var/www/html
    volumes:
      - ./docker.dev/start.sh:/usr/local/bin/start.sh:ro
      - ./:/var/www/html:delegated
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    depends_on:
      - db
      - redis
    networks:
      - deskmint_net

  db:
    image: mysql:8.0
    container_name: deskmint_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: deskmint_backend
      MYSQL_USER: deskmint
      MYSQL_PASSWORD: deskmint_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - deskmint_net

  redis:
    image: redis:8.4-alpine
    container_name: deskmint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - deskmint_net

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: deskmint_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - deskmint_net

  web:
    image: nginx:1.28.0-alpine
    container_name: deskmint_nginx
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker.dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - deskmint_net

volumes:
  db_data:
  redis_data:

networks:
  deskmint_net:
    driver: bridge