version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker.dev/php/Dockerfile
    image: deskmint-app:latest
    container_name: deskmint_app
    working_dir: /var/www/html
    volumes:
      - ./docker.dev/start.sh:/usr/local/bin/start.sh:ro
      - ./:/var/www/html:delegated
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    depends_on: []
    #user: "${UID:-1000}:${GID:-1000}"
    networks:
      - deskmint_net

  db:
    image: mysql:8.0
    container_name: deskmint_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: deskmint
      MYSQL_USER: deskmint
      MYSQL_PASSWORD: deskmint_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - deskmint_net

  web:
    image: nginx:stable
    container_name: deskmint_nginx
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker.dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - deskmint_net

volumes:
  db_data:

networks:
  deskmint_net:
    driver: bridge
