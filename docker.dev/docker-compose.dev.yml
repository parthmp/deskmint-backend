networks:
  deskmint-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

services:
  # PHP-FPM Service
  php:
    build:
      context: .
      dockerfile: docker.dev/dockerfile.dev
    container_name: laravel-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html  # Bind mount ALL Laravel code
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - PHP_IDE_CONFIG=serverName=Docker
    networks:
      - deskmint-network
    depends_on:
      - mysql
      - redis

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"  # Exposed for Vue and browser
    volumes:
      - ../:/var/www/html  # Same bind mount
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - deskmint-network
    depends_on:
      - php

  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"  # Exposed for HeidiSQL
    environment:
      MYSQL_DATABASE: deskmint_backend
      MYSQL_ROOT_PASSWORD: 
      MYSQL_PASSWORD: 
      MYSQL_USER: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - deskmint-network

  # Redis Service
  redis:
    image: redis:alpine3.22
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Optional: for Redis Desktop Manager
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - deskmint-network

  # Test Service (Separate)
  tests:
    build:
      context: .
      dockerfile: docker.dev/dockerfile.dev
    container_name: laravel-tests
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html  # Bind mount for tests
    environment:
      - APP_ENV=testing
      - DB_CONNECTION=sqlite
      - DB_DATABASE=:memory:
    command: >
      sh -c "composer install --no-interaction &&
             php artisan test"
    networks:
      - deskmint-network
    depends_on:
      - mysql
      - redis